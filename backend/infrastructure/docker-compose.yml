services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24
    cap_add:
      - SYS_NICE
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"
    container_name: clickhouse
    restart: unless-stopped
    volumes:
        - clickhouse_data:/var/lib/clickhouse
        - ./clickhouse:/docker-entrypoint-initdb.d
        - ./clickhouse/config.d:/etc/clickhouse-server/config.d
    ports:
        - "8123:8123"
        - "9000:9000"
    networks:
        - app-network
    healthcheck:
        test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - frontend_static:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - frontend
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network


  auth-service:
    user: root
    environment:
      - ${PYTHONPATH}
    build: ../services/auth-service
    expose:
      - "8000"
    container_name: auth-service
    restart: unless-stopped
    env_file: ../services/auth-service/app/core/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  api-gateway:
     expose:
       - "8000"
     build: ../services/api-gateway
     container_name: api-gateway
     restart: unless-stopped

     depends_on:
       redis:
         condition: service_healthy
       auth-service:
        condition: service_started
     networks:
       - app-network

  integration-service:
     build: ../services/integration-service
     container_name: integration-service
     restart: unless-stopped
     env_file: ../services/integration-service/app/core/.env
     depends_on:
       postgres:
         condition: service_healthy
       rabbitmq:
         condition: service_healthy
       redis:
        condition: service_healthy
     networks:
       - app-network

  sync-worker:
     build: ../services/sync-worker
     container_name: sync-worker
     restart: unless-stopped
     env_file: ../services/sync-worker/app/core/.env
     depends_on:
       postgres:
         condition: service_healthy
       rabbitmq:
         condition: service_healthy
     networks:
       - app-network

  normalization-service:
    build: ../services/normalization-service
    container_name: normalization-service
    restart: unless-stopped
    env_file: ../services/normalization-service/app/core/.env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  analytics-service:
    build: ../services/analytics-service
    container_name: analytics-service
    restart: unless-stopped
    env_file: ../services/analytics-service/app/core/.env
    depends_on:
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

