  #   networks:
  #     - app-network

  scheduler-service:
    build: ../services/scheduler-service
    container_name: scheduler-service
    restart: unless-stopped
    env_file: ../services/scheduler-service/app/core/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ../../frontend
    container_name: frontend
    restart: unless-stopped
    networks:
      - app-network

networks:       
  app-network:
    driver: bridge

volumes:
  frontend_static:
  redis_data:
  postgres_data:
  clickhouse_data:
  rabbitmq_data: